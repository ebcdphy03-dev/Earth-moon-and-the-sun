<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>Earth, Moon, and the Sun — Keyword Flashcards</title>
<style>
:root{--bg:#0b1026;--ink:#eef2ff;--card:#141b3d;--back:#1d2a5c;--acc:#ffb74d;--acc2:#64b5f6;--muted:#9fa8da}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 15%,#2a1b55 0,transparent 40%),radial-gradient(circle at 85% 80%,#123a5a 0,transparent 45%),var(--bg);display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 30%,#fff,transparent),radial-gradient(1px 1px at 80% 60%,#fff,transparent),radial-gradient(1px 1px at 45% 90%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 15%,#fff,transparent),radial-gradient(1px 1px at 15% 85%,#fff,transparent);opacity:.7}
header{text-align:center;padding:28px 16px 6px;position:relative}
h1{margin:0;font-size:clamp(22px,4vw,34px);letter-spacing:1px}h1 span{color:var(--acc)}
.sub{color:var(--muted);margin-top:6px;font-size:14px}
.orbitwrap{position:relative;width:min(560px,92vw);height:340px;margin:18px auto 8px;perspective:1200px}
.ring{position:absolute;inset:-14px;border:2px dashed rgba(100,181,246,.35);border-radius:50%;animation:spin 40s linear infinite}
.moon{position:absolute;top:-8px;left:50%;width:18px;height:18px;border-radius:50%;background:#cfd8dc;box-shadow:0 0 12px #fff}
@keyframes spin{to{transform:rotate(360deg)}}
.card{position:absolute;inset:0;cursor:pointer;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1);outline:none}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.front{background:linear-gradient(145deg,#1b2350,#0f1533);border:2px solid var(--acc2)}
.front .term{font-size:clamp(24px,5vw,38px);font-weight:700}
.front .hint{margin-top:14px;color:var(--muted);font-size:13px}
.sun{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,#fff59d,#ffb300 60%,#ef6c00);box-shadow:0 0 30px #ffb300;margin-bottom:18px}
.back{background:linear-gradient(145deg,var(--back),#101a40);border:2px solid var(--acc);transform:rotateY(180deg)}
.back .t{color:var(--acc);font-weight:700;font-size:18px;margin-bottom:10px}
.back .d{font-size:clamp(15px,2.4vw,18px);line-height:1.55}
.card:focus-visible .face{outline:3px solid #fff;outline-offset:4px}
.controls{display:flex;gap:12px;align-items:center;margin:20px 0 6px}
button{background:var(--card);color:var(--ink);border:1.5px solid var(--acc2);border-radius:999px;padding:10px 18px;font-size:15px;cursor:pointer}
button:hover{background:#22306a}button:disabled{opacity:.4;cursor:default}
.prog{width:min(560px,92vw);height:8px;background:#1f274d;border-radius:99px;overflow:hidden;margin-top:10px}
.bar{height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));width:0;transition:width .3s}
.count{color:var(--muted);font-size:14px;margin-top:8px}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px;margin:14px 0 30px}
.dot{width:12px;height:12px;border-radius:50%;background:#2c3566;cursor:pointer;border:none;padding:0}.dot.seen{background:var(--acc2)}.dot.cur{background:var(--acc);transform:scale(1.3)}
.keys{color:var(--muted);font-size:12.5px;margin-bottom:24px;text-align:center;padding:0 12px}
</style></head><body><div class='stars'></div>
<header><h1>Earth, Moon, <span>and the Sun</span></h1><div class='sub'>Grade 7 Physics • Keyword Flashcards</div></header>
<div class='orbitwrap'><div class='ring'><div class='moon'></div></div>
<div class='card' id='card' tabindex='0' role='button' aria-label='Flashcard, press Space to flip'>
<div class='face front'><div class='sun'></div><div class='term' id='term'></div><div class='hint'>Click or press Space to flip</div></div>
<div class='face back'><div class='t' id='bterm'></div><div class='d' id='def'></div></div></div></div>
<div class='prog'><div class='bar' id='bar'></div></div><div class='count' id='count'></div>
<div class='controls'><button id='prev'>◀ Prev</button><button id='flip'>Flip</button><button id='next'>Next ▶</button><button id='shuf'>Shuffle</button></div>
<div class='dots' id='dots'></div>
<div class='keys'>Keyboard: Space / Enter = flip • ← → = previous / next • S = shuffle</div>
<script>
let cards=[{"t":"Aphelion","d":"The point in the Earth’s orbit where it is farthest from the Sun, reached around 4 July."},{"t":"Axis of Rotation","d":"The imaginary line through the North and South Poles about which the Earth spins; it is tilted about 23.5° from the vertical relative to the orbit."},{"t":"Corona","d":"The outermost layer of the Sun’s atmosphere, seen as a glowing halo only during a total solar eclipse."},{"t":"Eclipse","d":"An event in which one celestial body passes into the shadow of another, or blocks its light from a viewer."},{"t":"Equinox","d":"Either of the two days (about 20 March and 23 September) when the Sun’s rays fall directly on the equator and day and night are nearly equal everywhere."},{"t":"Leap Year","d":"A year of 366 days, made by adding 29 February every fourth year to use up the extra 6 hours of each revolution. Formula: 4 × 6 h = 24 h = 1 day."},{"t":"Lunar Eclipse","d":"An eclipse that occurs at full moon when the Earth comes between the Sun and the Moon (Sun – Earth – Moon) and the Earth’s shadow falls on the Moon."},{"t":"Penumbra","d":"The lighter, outer part of a shadow where the light source is only partly blocked; observers here see a partial eclipse."},{"t":"Perihelion","d":"The point in the Earth’s orbit where it is closest to the Sun, reached around 3 January."},{"t":"Revolution","d":"The movement of the Earth around the Sun along an elliptical orbit; one revolution takes about 365 days and 6 hours."},{"t":"Rotation","d":"The spinning of the Earth on its axis from West to East; one rotation takes nearly 24 hours and causes day and night. Formula: rate of turning = 360° / 24 h = 15° per hour."},{"t":"Sidereal Day","d":"The time taken by the Earth to rotate once relative to the distant stars, about 23 hours, 56 minutes and 4 seconds."},{"t":"Solar Eclipse","d":"An eclipse that occurs at new moon when the Moon comes between the Sun and the Earth (Sun – Moon – Earth) and its shadow falls on the Earth."},{"t":"Solstice","d":"Either of the two days when one hemisphere is tilted most towards the Sun: about 21 June (longest day in the Northern Hemisphere) and 22 December (shortest day)."},{"t":"Umbra","d":"The dark, central part of a shadow where the light source is completely blocked; observers here see a total eclipse."}];let order=cards.map((_,i)=>i),i=0,seen=new Set([0]);
const card=document.getElementById('card'),dots=document.getElementById('dots');
function draw(){const c=cards[order[i]];card.classList.remove('flipped');
document.getElementById('term').textContent=c.t;document.getElementById('bterm').textContent=c.t;document.getElementById('def').textContent=c.d;
document.getElementById('count').textContent='Card '+(i+1)+' of '+cards.length+' • '+seen.size+' viewed';
document.getElementById('bar').style.width=(seen.size/cards.length*100)+'%';
document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===cards.length-1;
dots.innerHTML='';order.forEach((o,k)=>{const d=document.createElement('button');d.className='dot'+(seen.has(k)?' seen':'')+(k===i?' cur':'');d.setAttribute('aria-label','Go to card '+(k+1));d.onclick=()=>go(k);dots.appendChild(d);});}
function go(k){if(k<0||k>=cards.length)return;i=k;seen.add(k);draw();}
function flip(){card.classList.toggle('flipped');}
card.onclick=flip;document.getElementById('flip').onclick=flip;
document.getElementById('prev').onclick=()=>go(i-1);document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('shuf').onclick=()=>{for(let a=order.length-1;a>0;a--){const b=Math.floor(Math.random()*(a+1));[order[a],order[b]]=[order[b],order[a]];}i=0;seen=new Set([0]);draw();};
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}else if(e.key==='ArrowRight')go(i+1);else if(e.key==='ArrowLeft')go(i-1);else if(e.key==='s'||e.key==='S')document.getElementById('shuf').click();});
draw();
</script></body></html>
